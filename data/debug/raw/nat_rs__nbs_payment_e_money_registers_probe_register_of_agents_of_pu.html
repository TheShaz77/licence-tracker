<script type="text/javascript">
    var myAppContext = null;

    $(function () {

        var myAppContextSetting = {
            "AppUrl": "/WebApp"
        };

        myAppContext = new NBS.App.StandardApp(myAppContextSetting);
        myAppContext.Init();

        // myAppContext.Setting.AppUrl

        var flatPickrSettingForDate = {
            locale: "en",

            dateFormat: "m/d/Y",
            allowInput: true,

            enableTime: false,
            time_24hr: true
        };

        var flatPickrSettingForDateTime = {
            locale: "en",

            dateFormat: "m/d/Y H:i",
            allowInput: true,

            enableTime: true,
            time_24hr: true
        };

        flatpickr("input[my-date-type=\"Date\"]", flatPickrSettingForDate);
        flatpickr("input[my-date-type=\"DateTime\"]", flatPickrSettingForDateTime);
    
        // window.addEventListener('load', adjustMainPadding);
        window.addEventListener('resize', adjustMainPadding);
        adjustMainPadding();
    });

    function adjustMainPadding() 
    {
        const topHeader = document.querySelector('.top-header');
        const mainNavbar = document.querySelector('.main-navbar');
        const main = document.querySelector('main');

        let offset = 0;

        if (window.getComputedStyle(topHeader).display !== 'none') {
            offset += topHeader.offsetHeight;
        }

        if (mainNavbar) {
            offset += mainNavbar.offsetHeight;
        }

        main.style.paddingTop = offset + 'px';
    }
</script>

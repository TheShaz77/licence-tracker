    #create-label {
      position: fixed;
      right: 100px;
      color: #ffff !important;
      padding: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      z-index: 99;
      bottom: 30px;
      background-color: #089949;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
      /* Start hidden & slightly lowered */
      opacity: 0;
      transform: translateY(20px);
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
      pointer-events: none;
      /* Prevent clicks when hidden */
    }

    #create-label.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      /* Enable clicks when visible */
    }

    #create-label:hover {
      transform: scale(1.08);
      /* smooth zoom */
      background-color: #23a75e;
    }

    /* For small screens: move to top instead of bottom */
    @media (max-width: 640px) {
      #create-label {
        top: 110px;
        bottom: auto;
        right: 20px;
        /* optional: bring closer for mobile */
        transform: translateY(-20px);
        /* adjust animation for top */
      }

      #create-label.show {
        transform: translateY(0);
      }
    }
  </style>

  <script>
    function detectChatOpen() {
      const iframe = document.querySelector("iframe[name='webchat']");
      const createLabel = document.getElementById("create-label");

      if (!iframe) {
        return setTimeout(detectChatOpen, 300);
      }

      // Observe changes to the iframe itself (class changes)
      const observer = new MutationObserver(() => {
        const classList = iframe.className;

        if (classList.includes("bpOpen")) {
          createLabel.classList.add("show");
        } else if (classList.includes("bpClose")) {
          createLabel.classList.remove("show");
        }
      });

      observer.observe(iframe, {
        attributes: true,
        attributeFilter: ["class"], // only watch class changes
      });

      // Initial state
      const initialClass = iframe.className;
      if (initialClass.includes("bpOpen")) {
        createLabel.classList.add("show");
      } else {
        createLabel.classList.remove("show");
      }
    }

    detectChatOpen();
  </script>

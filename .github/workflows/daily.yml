name: Daily licence check   # runs every 2 hours despite the name

on:
  schedule:
        - cron: "17 */12 * * *"   # every 12 hours: 00:17 and 12:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these sources (comma-separated, e.g. eba,pra). Blank = all."
        required: false
        default: ""

permissions:
  contents: write
  issues: write        # change alerts are posted as issues; GitHub emails you about them

concurrency:
  group: licence-tracker-daily   # its own queue, so the seed scan can't cancel it
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install headless browser (for the Bank of Canada pages)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "Browser install failed (attempt $i), retrying in 60 seconds"
            sleep 60
          done
          echo "Browser not installed; the Bank of Canada source will be skipped this run"

      - name: Fetch registers, detect changes, update the sheet
        env:
          FCA_API_EMAIL: ${{ secrets.FCA_API_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built in, nothing to set up
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m regtracker run --sources "${{ github.event.inputs.sources }}"
          else
            python -m regtracker run
          fi

      - name: Save snapshots back to the repo
        if: always()
        run: |
          git config user.name "licence-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Register snapshot $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1

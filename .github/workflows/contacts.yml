name: Contact details (firm websites)

on:
  schedule:
        - cron: "53 3-23/12 * * *"   # every 12 hours: 03:53 and 15:53 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licence-tracker-contacts
  cancel-in-progress: false

jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read firm websites
        env:
          FCA_API_EMAIL: ${{ secrets.FCA_API_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
        run: python -m regtracker contacts --hours 1.8

      - name: Save progress
        if: always()
        run: |
          git config user.name "licence-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/state/contacts_web.json
          git diff --cached --quiet || git commit -m "Contact details $(date -u +%FT%H%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1

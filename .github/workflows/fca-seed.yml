name: FCA seed scan (one-off)

# Builds the initial index of UK payment & e-money firms by walking FRN ranges
# through the FCA API. Runs in 5.5-hour chunks every 6 hours and stops by
# itself once the scan is complete. Disable this workflow afterwards.

on:
  schedule:
      - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licence-tracker-fca-seed   # separate from the daily check, which must never be cancelled
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check whether the seed is already finished
        id: check
        run: |
          python -m regtracker status | tee status.txt
          if grep -q "FCA seed: complete" status.txt; then echo "done=true" >> "$GITHUB_OUTPUT"; fi

      - name: Scan the next chunk of FRNs
        if: steps.check.outputs.done != 'true'
        env:
          FCA_API_EMAIL: ${{ secrets.FCA_API_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
        run: python -m regtracker fca-seed --hours 1.8

      - name: Save progress
        if: always() && steps.check.outputs.done != 'true'
        run: |
          git config user.name "licence-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "FCA seed progress $(date -u +%FT%H%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push failed (attempt $i), retrying"; sleep $((i * 10))
          done
          exit 1

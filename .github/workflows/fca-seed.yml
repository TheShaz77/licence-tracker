name: FCA seed scan (one-off)

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licence-tracker
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check whether the seed is already finished
        id: check
        run: |
          python -m regtracker status | tee status.txt
          if grep -q "FCA seed: complete" status.txt; then echo "done=true" >> "$GITHUB_OUTPUT"; fi

      - name: Scan the next chunk of FRNs
        if: steps.check.outputs.done != 'true'
        env:
          FCA_API_EMAIL: ${{ secrets.FCA_API_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
        run: python -m regtracker fca-seed --hours 5.4

      - name: Save progress
        if: always() && steps.check.outputs.done != 'true'
        run: |
          git config user.name "licence-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "FCA seed progress $(date -u +%FT%H%MZ)"
          git pull --rebase --autostash || true
          git push

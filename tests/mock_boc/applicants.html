<html><body><table id="t"><thead><tr><th>Legal name</th><th>Main trade name</th><th>Head office country</th><th>X</th></tr></thead>
<tbody><tr><td>List is loading</td></tr></tbody></table>
<script>
const GROUP = "applicant";
fetch('/data/accounts.json').then(r => r.json()).then(d => {
  const tb = document.querySelector('#t tbody'); tb.innerHTML = '';
  d.filter(x => x.group_label === GROUP).forEach(x => { const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="/detail.html?account_id=${x.id}">${x.en_legal_name || x.fr_legal_name}</a></td><td>${x.main_trade_name}</td><td>${x.head_office_country}</td><td></td>`;
    tb.appendChild(tr); });
});
</script></body></html>

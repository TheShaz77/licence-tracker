  BS:
    regulator: CBOB
    files:
    # The Central Bank's "Supervised Financial Institutions" list (a new PDF most weeks): the newest one
    # is the first PDF on the page. Each line starts with a master code: LIC = bank / trust company,
    # PSP = electronic money service provider, MTB = money transmission service provider.
    - label: CBOB supervised institutions - banks
      page: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
      link_pattern: 'cdn\.centralbankbahamas\.com/.*Supervised-Financial-Institutions-List.*\.pdf'
      link_pick: first
      format: text_regex
      ignore_case: false
      row_regex: '^(?P<id>LIC\d{4})\s+(?P<name>.+?)\s+(?:Non-)?Resident\s+(?P<type>Bank & Trust|Bank)\s+(?:Not an )?Authorized\b.*?\s(?P<phone>\(\d{3}\)\s*\d{3}-\d{4})\s*$'
      section_regex: '^(Authorized Agents|Authorized Dealers|Other Public Licensees|Restricted|Non-Active Licensees)\s*$'
      exclude_column: section
      exclude_pattern: Non-Active
      licence_type: Bank / bank & trust company (CBOB)
      register_url: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
    - label: CBOB supervised institutions - electronic money service providers
      page: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
      link_pattern: 'cdn\.centralbankbahamas\.com/.*Supervised-Financial-Institutions-List.*\.pdf'
      link_pick: first
      format: text_regex
      ignore_case: false
      row_regex: '^(?P<id>PSP\d{4})\s+(?P<name>.+?)\s+(?:[A-Z]{1,3}-\d+|n/a)\s+(?P<phone>\(\d{3}\)\s*\d{3}-\d{4}|n/a)\s*$'
      licence_type: Electronic money service provider (CBOB)
      register_url: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
    - label: CBOB supervised institutions - money transmission service providers
      page: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
      link_pattern: 'cdn\.centralbankbahamas\.com/.*Supervised-Financial-Institutions-List.*\.pdf'
      link_pick: first
      format: text_regex
      ignore_case: false
      row_regex: '^(?P<id>MTB\d{4})\s+(?P<name>.+?)\s+(?:[A-Z]{1,3}-\d+|n/a)\s+(?P<phone>\(\d{3}\)\s*\d{3}-\d{4}|n/a)\s*$'
      licence_type: Money transmission service provider (CBOB)
      register_url: https://www.centralbankbahamas.com/bank-supervision/supervised-financial-institutions
    # Securities Commission: register of digital asset businesses (DARE Act), a PDF re-issued monthly
    # under a new address; the site's own media list (WordPress) gives the newest one.
    - label: SCB register of digital asset businesses (DARE Act)
      page: https://scb.gov.bs/wp-json/wp/v2/media?search=DARE%20Firms%20as%20at&per_page=30&orderby=date&order=desc
      link_pattern: 'DARE-Firms-as-at[^"\s]*\.pdf'
      regulator: SCB
      format: text_regex
      multiline: true
      row_regex: 'Digital Asset Business:\s*(?P<name>[^\n]+)(?:(?!Digital Asset Business:)[\s\S]){0,4000}?Registration Type:?\s*(?P<type>[^\n]+)'
      type_patterns:
        exchange: Digital asset exchange and digital asset business (SCB, DARE Act)
        .: Digital asset business (SCB, DARE Act)
      register_url: https://scb.gov.bs/dare/
    - label: SCB registrant / licensee search (probe)
      url: https://scb.gov.bs/registrant-licensee-search/
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|DARE|digital asset|securities firm|register
      follow_max: 12

  KY:
    regulator: CIMA
    files:
    - label: CIMA entity search
      url: https://www.cima.ky/search-entities-cima
      probe: true
      follow: search|entit|virtual|money services|bank

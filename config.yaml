    - label: CBRT payment institutions
      url: https://www.tcmb.gov.tr/wps/wcm/connect/TR/TCMB+TR/Main+Menu/Temel+Faaliyetler/Odeme+Hizmetleri/Odeme+Kuruluslari
      format: html_table
      name_column: Kuruluş Unvanı
      id_column: Kuruluş Kodu
      licence_type: Payment institution
    - label: SPK crypto asset service providers
      regulator: SPK
      url: https://spk.gov.tr/kurumlar/kripto-varlik-hizmet-saglayicilar/faaliyette-bulunanlar-listesi
      format: html_table
      licence_type: Crypto asset service provider (SPK)
    - label: SPK crypto list page

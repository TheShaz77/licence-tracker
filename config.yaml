  GG:
    regulator: AGCC (Alderney)
    files:
    - label: Alderney eGambling licensees
      url: https://www.gamblingcontrol.org/applications-guidance/egambling-licensees
      format: text_regex
      multiline: true
      row_regex: '(?m)^Company Name(?: \(Licence Category\))?\s*\n(?P<name>[^\n()]{2,150}?(?:\([^)\n]*\)[^\n()]*?)?)\s*\((?P<type>1\s*&\s*2|1|2)\)\s*$'
      type_patterns:
        '1\s*&\s*2': eGambling licence - category 1 & 2, B2C + B2B (AGCC)
        '^1$': eGambling licence - category 1, B2C (AGCC)
        '^2$': eGambling licence - category 2, B2B (AGCC)
    - label: Alderney temporary eGambling licensees
      url: https://www.gamblingcontrol.org/temporary-egambling-licensees
      empty_pattern: 'There are currently no Temporary'
      format: text_regex
      multiline: true
      row_regex: '(?m)^Company Name(?: \(Licence Category\))?\s*\n(?!N/A)(?P<name>[^\n]{2,150}?)\s*(?:\((?:1\s*&\s*2|1|2)\))?\s*$'
      licence_type: Temporary eGambling licence (AGCC)
    - label: Alderney core service provider associates
      url: https://www.gamblingcontrol.org/core-service-provider-associates
      format: text_regex
      multiline: true
      row_regex: '(?m)^Company Name(?: \(Licence Category\))?\s*\n(?!N/A)(?P<name>[^\n]{2,150}?)\s*(?:\((?:1\s*&\s*2|1|2)\))?\s*$'
      licence_type: Core service provider associate - B2B (AGCC)
    - label: Alderney category 1 and 2 associate certificates
      url: https://www.gamblingcontrol.org/category-1-and-2-associate-certificates
      format: text_regex
      multiline: true
      row_regex: '(?m)^Company Name(?: \(Licence Category\))?\s*\n(?!N/A)(?P<name>[^\n]{2,150}?)\s*(?:\((?:1\s*&\s*2|1|2)\))?\s*$'
      licence_type: Category 1/2 associate certificate - B2B (AGCC)

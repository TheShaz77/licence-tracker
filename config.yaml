        securities (firm|dealer): Securities firm (FINMA)
      register_url: https://www.finma.ch/en/finma-public/authorised-institutions-individuals-and-products/
igaming:
  GB:
    regulator: Gambling Commission
    files:
    - label: UKGC register - remote and B2B gambling licences
      url: https://www.gamblingcommission.gov.uk/downloads/business-licence-register-licences.csv
      join: {url: 'https://www.gamblingcommission.gov.uk/downloads/business-licence-register-businesses.csv', 'on': Account Number}
      name_column: Account Name
      id_column: Account Number
      type_from_row: true
      type_patterns:
        'gambling software': Gambling software - B2B supplier (UKGC)
        'remote[^,]*gaming machine technical|host': Remote gaming machine technical / host - B2B (UKGC)
        'remote[^,]*casino': Remote casino (UKGC)
        'remote[^,]*bet': Remote betting (UKGC)
        'remote[^,]*bingo': Remote bingo (UKGC)
        'remote[^,]*lotter': Remote lottery (UKGC)
      register_url: https://www.gamblingcommission.gov.uk/public-register/businesses

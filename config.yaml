      format: pdf_table
      name_column: LICENSEE
      type_column: CATEGORIES
      address_column: ADDRESS
      type_patterns:
        CFD: Securities firm - CFD trading (SCB)
        dealing: Securities firm - dealing as agent or principal (SCB)
  AU:
    regulator: ASIC
    files:
    - label: ASIC AFS licensees that make a market in derivatives / FX
      page:
      - https://data.gov.au/data/dataset/asic-afs-licensee
      - https://data.gov.au/data/dataset/asic-afs-licensee/resource/d98a113d-6b50-40e6-b65f-2612efc877f4
      - https://www.data.gov.au/data/dataset/asic-afs-licensee/resource/1fc2b334-74ae-4588-85aa-83e3a8c9f2cc
      - https://data.gov.au/data/api/3/action/package_show?id=asic-afs-licensee
      link_pattern: afs_lic_\d{6}\.(csv|tsv)
      fallback_urls:     # last known copies, used if no newer link can be found
      - https://data.gov.au/data/dataset/ab7eddce-84df-4098-bc8f-500d0d9776d1/resource/d98a113d-6b50-40e6-b65f-2612efc877f4/download/afs_lic_202602.csv
      - https://data.gov.au/data/dataset/ab7eddce-84df-4098-bc8f-500d0d9776d1/resource/1fc2b334-74ae-4588-85aa-83e3a8c9f2cc/download/afs_lic_202512.tsv
      name_column: AFS_LIC_NAME
      id_column: AFS_LIC_NUM
      date_column: AFS_LIC_START_DT
      city_column: AFS_LIC_ADD_LOCAL
      require_column: AFS_LIC_CONDITION
      require_pattern: '^(?=.*make a market)(?=.*(derivative|foreign exchange)).*'
      name_exclude: energy|power|electric|\bgas\b|hydro|\bwater\b|grain|agri|mining|resources|superannuation|insurance|\bfuel|petroleum|\boil\b
      licence_type: AFS licence - market maker in derivatives / FX (ASIC)
      register_url: https://connectonline.asic.gov.au/RegistrySearch/
  NZ:
    regulator: FMA
    files:
    - label: FMA licensed derivatives issuers
      url: https://www.fma.govt.nz/business/licensed-providers/?start={page}
      paginate: {start: 0, step: 15, max: 30, marker: 'Displaying page \d+'}
      format: text_regex
      row_regex: '^(?P<name>[^,]{3,150}?)(?:\s*\([^)]*\))?,\s*(?:(?P<id>FSP\d+),\s*)?[^.]{0,200}?derivatives issuer'
      licence_type: Licensed derivatives issuer (FMA)
      register_url: https://www.fma.govt.nz/business/licensed-providers/
  CH:

    - label: BNM MSB licensees
      url: https://www.bnm.gov.my/regulations/fsp-directory/msb-licensees
      format: html_table
      name_column: Licensee
      id_column: Business Registration Number
      type_column: Type of money services
      address_column: Full Address
      type_patterns:
        remittance.*currency|currency.*remittance: Money services business – remittance & currency exchange
        remittance: Money services business – remittance
        currency: Money services business – currency exchange
    - label: BNM FSP directory (banks)

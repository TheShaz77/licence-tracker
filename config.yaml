# GitHub stops a run after 3 hours (and then nothing is saved). The run starts no new source after
# run_budget_minutes, stops any single source after source_timeout_minutes (it keeps its last list),
# and leaves what didn't fit for the next run - least recently tried first.
run_budget_minutes: 100
source_timeout_minutes: 30
run_reserve_minutes: 20

# Do-not-contact list and OpenPayd competitors (flags/do_not_contact.txt, flags/groups.yaml).
# Flagged firms are coloured red on every tab, with the reason in "Flag reason". Each run also looks
# up related entities (parents / subsidiaries) of listed companies in GLEIF and Wikidata, a slice
# at a time, and re-checks each company monthly.
flags:
  enabled: true
  seconds_per_run: 900
  refresh_days: 30

# Banks (and other financial firms) for countries with no readable official list (or a regulator that blocks automated
# access): Wikidata (CC0) entities that are banks there, plus Wikipedia's "List of banks in ...".
# Labelled "licence not checked"; banks an official list already has are left out of the sheet.
wiki_banks:
  min_hours: 0
  minutes_per_run: 15     # countries refreshed per run (oldest first); each list is refreshed weekly
  refresh_days: 7
  countries: [AD, AG, AI, AR, AW, BD, BH, BJ, BM, BN, BS, BT, BZ, CG, CI, CL, CN, CO, CR, CV, CW, DJ, DM, DO, DZ, EC, EG, ER, FM, GA, GD, GE, GI, GQ, GT, GY, HN, ID, IL, IM, JE, KI, KM, KN, KY, LC, LK, LR, LS, MD, ME, MG, MH, MK, MO, MR, MS, MU, MV, MX, NA, NE, NR, NZ, OM, PE, PH, PR, PW, PY, QA, RS, RW, SA, SB, SC, SL, SM, SR, ST, SV, SX, SZ, TD, TG, TH, TL, TO, TV, TW, VA, VC, WS, XK, ZM]
  # payment / e-money / money transfer / FX / crypto firms (all countries outside the UK, EU/EEA,
  # Switzerland, the US and Canada, which have their own registers)
  fi_countries: [AD, AE, AG, AI, AR, AU, AW, BD, BH, BJ, BM, BN, BR, BS, BT, BZ, CG, CI, CL, CN, CO, CR, CV, CW, DJ, DM, DO, DZ, EC, EG, ER, ET, FJ, FM, GA, GD, GE, GG, GI, GM, GQ, GT, GY, HK, HN, ID, IL, IM, IN, JE, KI, KM, KN, KR, KY, LC, LK, LR, LS, MC, MD, ME, MG, MH, MK, MN, MO, MR, MS, MU, MV, MW, MX, MY, NA, NE, NG, NR, NZ, OM, PE, PH, PR, PW, PY, QA, RS, RW, SA, SB, SC, SG, SL, SM, SR, ST, SV, SX, SZ, TC, TD, TG, TH, TL, TO, TR, TV, TW, UY, VA, VC, WS, XK, ZA, ZM]
  pages: {}

# ----------------------------------------------------------------------------- CFD vertical ---
# Retail CFD/FX brokers, institutional / prime brokers, liquidity providers and prop firms.
# Same reader options as national: above; firms go to "Country (CFD)" tabs and the
# "CFD (all countries)" tab, with a business-type column that is a guess from the name and licence.
# The UK comes from the FCA scan (sources: fca: cfd:).
cfd_min_hours: 24
cfd:
  EU:
    regulator: ESMA register
    files:
    - label: ESMA register - investment firms dealing on own account (all EEA)
      url: https://registers.esma.europa.eu/solr/esma_registers_upreg/select?q=%7B!parent%20which%3D%22type_s%3Aparent%22%7D(%2Bac_serviceName%3A%22Dealing%20on%20own%20account%22)&fq=ae_entityTypeCode%3AMIF&wt=json&rows=20000
      fallback_urls:
      - https://registers.esma.europa.eu/solr/esma_registers_upreg/select?q=%7B!parent%20which%3D%22type_s%3Aparent%22%7D(%2Bac_serviceName%3A%22Dealing%20On%20Own%20Account%22)&fq=ae_entityTypeCode%3AMIF&wt=json&rows=20000
      - https://registers.esma.europa.eu/solr/esma_registers_upreg/select?q=%7B!parent%20which%3D%22type_s%3Aparent%22%7Dac_serviceName%3A*own%5C%20account*&fq=ae_entityTypeCode%3AMIF&wt=json&rows=20000
      name_column: ae_entityName
      id_column: ae_lei
      lei_column: ae_lei
      country_column: ae_homeMemberState
      regulator_column: ae_competentAuthority
      address_column: ae_headOfficeAddress
      website_column: ae_website
      status_column: ae_status
      date_column: ae_authorisationNotificationDateStr
      exclude_column: ae_officeType
      exclude_pattern: branch
      licence_type: Investment firm - dealing on own account (MiFID)
      register_url: https://registers.esma.europa.eu/publication/searchRegister?core=esma_registers_upreg
  CY:
    regulator: CySEC
    files:
    # CySEC's own site disallows automated access (robots.txt); the same firms are on the ESMA
    # register, which CySEC reports them to (every Cyprus Investment Firm is a MiFID investment firm)
    - label: Cyprus Investment Firms (CIFs) - ESMA register, as reported by CySEC
      url: https://registers.esma.europa.eu/solr/esma_registers_upreg/select?q=*:*&fq=ae_entityTypeCode%3AMIF&fq=ae_homeMemberState%3Acyprus&wt=json&rows=5000
      name_column: ae_entityName
      lei_column: ae_lei
      address_column: ae_headOfficeAddress
      website_column: ae_website
      status_column: ae_status
      date_column: ae_authorisationNotificationDateStr
      exclude_column: ae_officeType
      exclude_pattern: branch
      licence_type: Cyprus Investment Firm (CySEC, via ESMA register)
      register_url: https://registers.esma.europa.eu/publication/searchRegister?core=esma_registers_upreg
  # Mauritius: the FSC's register moved to a new site (opr.fscmauritius.org) that shows 50 firms per page and
  # only turns pages through its own in-page requests, so the investment dealers (the licence CFD brokers
  # hold) can't be listed completely yet. Left out rather than shown half-complete.

  MU:
    regulator: FSC
    files:
    # FSC online public register. It shows each firm's licence, not whether it offers CFDs.
    - label: FSC public register - investment dealers
      url: https://opr.fscmauritius.org/ords/opr/r/fsc-opr/fsc-online-public-register-opr
      apex_irr: OPR
      format: html_table
      name_column: Name of Licensee
      type_column: Type of Licence
      date_column: Date of Licence
      status_column: Annotations
      register_url: https://opr.fscmauritius.org/ords/opr/r/fsc-opr/fsc-online-public-register-opr
      type_patterns:
        'SEC-2\.1[AB]\b': Investment dealer - full service (FSC SEC-2.1) - CFD permission not shown on the register
        'SEC-2\.[23]\b|SEC-6\.3\b': Investment dealer - broker (FSC SEC-2.2/2.3/6.3) - CFD permission not shown on the register
  SC:
    regulator: FSA
    files:
    - label: FSA capital markets - securities dealers
      url: https://fsaseychelles.sc/regulated-entities/capital-markets
      format: text_regex
      raw_html: true
      row_regex: 'id="heading-(?P<type>[a-z0-9-]+?)-\d+"(?:(?!id="heading-).)*?<div class="card-body">\s*<h5>\s*(?P<name>[^<]+?)\s*</h5>(?:(?:(?!id="heading-).)*?fa-map"></span>(?P<address>[^<]*))?(?:(?:(?!id="heading-).)*?href="tel:(?P<phone>[^"]*)")?(?:(?:(?!id="heading-).)*?href="mailto:(?P<email>[^"]*)")?(?:(?:(?!id="heading-).)*?fa-globe"></span>\s*<a href="(?P<website>[^"]*)")?'
      type_patterns:
        '^securities-dealer$': Securities dealer (FSA)
      register_url: https://fsaseychelles.sc/regulated-entities/capital-markets
  BS:
    regulator: SCB
    files:
    - label: SCB registered securities firms (SIA) - dealing / CFD trading

# Licence tracker configuration
# ---------------------------------------------------------------------------

# Firms licensed in these countries are never included (ISO-2 codes).
# Default = countries under comprehensive UK/EU/US sanctions programmes.
# Syria: UK, EU and US sanctions were substantially eased in 2025-26 - keep or
# remove SY in line with your compliance team's policy.
excluded_countries: [RU, BY, IR, KP, CU, SY]

# If a register suddenly lists fewer than 70% of yesterday's active firms,
# treat it as a broken download: skip it for the day instead of reporting
# mass "removals".
drop_guard: 0.7

# How many of the most recent changes to show on the "Changes" tab.
sheet_change_rows: 5000

# Give each country its own tab in the Google Sheet (as well as the all-countries
# "Licences" tab).
sheet_country_tabs: true

sources:
  fca:            # UK: EMIs, small EMIs, APIs, SPIs, cryptoasset firms, e-money & payment agents (FCA API)
    enabled: true
    requests_per_second: 4.5      # FCA limit is 50 per 10 seconds
    parallel_requests: 8          # lookups in flight at once (still capped by the line above)
    enrich_address: true          # one extra call per firm, once: town, website, phone
    exclude_types: [RAISP]        # licence types not tracked (account-information-only firms)
    agents: [emd, psd]            # also track e-money agents (emd) and payment agents (psd)
    # One-off seed scan, in this order. Editing this list is safe: ranges
    # already scanned are kept, and the rest is re-planned in the new order.
    seed_ranges:
      - [900000, 999999]          # most EMIs (and cryptoasset firms registered since 2020)
      - [1000000, 1100000]        # 7-digit FRNs issued since 2023 (the newest firms)
      - [500000, 899999]          # most APIs / SPIs
    # 100000-499999 (pre-2009 firms, mostly banks/insurers) is not scanned; the
    # few cryptoasset firms there are tracked via data/fca_crypto_frns.txt.
    frontier_back: 3000           # daily: re-scan this many FRNs below the newest
    frontier_ahead: 2000          # ...and this many above it
    frontier_back_weekly: 25000   # weekly wider re-scan
    full_recheck_weekday: 6       # 0=Mon ... 6=Sun: also re-check inactive firms
    track_services: false

  pra:            # UK: banks and building societies (PRA monthly lists)
    enabled: false   # banks no longer tracked
    # urls:                       # uncomment to pin the CSVs if the page changes
    #   banks: https://www.bankofengland.co.uk/-/media/...csv
    #   building_societies: https://www.bankofengland.co.uk/-/media/...csv

  eba:            # EU/EEA: PIs, EMIs, AISPs and small/exempt PIs & EMIs
    enabled: true
    entity_types: [PSD_PI, PSD_EMI, PSD_AISP, PSD_EPI, PSD_EEMI]
    exclude_jurisdictions: [GB]   # UK comes from the FCA instead
    track_services: true          # also flag changes to authorised services

  ecb:            # EU: credit institutions (banks), ECB daily MFI list
    enabled: false   # credit institutions no longer tracked
    exclude_jurisdictions: [GB]

  fintrac:        # Canada: money services businesses (FINTRAC publishes monthly)
    enabled: true

  boc:            # Canada: payment service providers under the RPAA (Bank of Canada)
    enabled: true
    details_per_run: 400          # detail pages (email, website) opened per run; cached after that
    details_first: applicant      # which list gets its emails/websites filled in first
    detail_delay_seconds: 1.0     # pause between detail pages, to be polite to the site

  finma:          # Switzerland: banks and FinTech licence holders
    enabled: true
    include_types: "article 1b|fintech"   # FinTech licence holders ("Persons under Article 1b of the Banking Act")
    exclude_types: "representati"         # not the representations of foreign FinTech firms

  fincen:         # US: FinCEN's own site. Off: its robots.txt blocks automated downloads; the same
    enabled: false # list comes in through fincen_os (OpenSanctions copy) below
    min_hours: 12 # FinCEN updates weekly; no need to download the 5 MB file every 2 hours

  fincen_os:      # US: FinCEN's MSB list via OpenSanctions' daily copy (FinCEN blocks automated downloads)
    enabled: true  # OpenSanctions data is free for NON-COMMERCIAL use only; use inside a for-profit
                   # business (e.g. prospecting for an employer) needs their data licence.
    min_hours: 20

  mica:           # EU/EEA: MiCA crypto-asset service providers and e-money token issuers (ESMA register)
    enabled: true
    min_hours: 6

  ch_sro:         # Switzerland: AML SRO membership, looked up firm by firm on FINMA's member search
    enabled: true
    min_hours: 20                 # once a day
    lookups_per_run: 40
    recheck_days: 60

  za_tppp:        # South Africa: third-party payment providers (SARB public register)
    enabled: true
    min_hours: 12
  za_so:          # South Africa: payment system operators (SARB)
    enabled: true
    min_hours: 12
  za_pchso:       # South Africa: payment clearing house system operators (SARB)
    enabled: true
    min_hours: 12
  za_banks:       # South Africa: banks, branches of foreign banks, mutual banks (Prudential Authority)
    enabled: true
    min_hours: 12
  za_banks_wiki:  # South Africa: banks from Wikipedia's list (unofficial backup; off now the official SARB lists load)
    enabled: false
    min_hours: 20
  za_adla:        # South Africa: authorised dealers in foreign exchange with limited authority (SARB ADLA manual)
    enabled: true
    min_hours: 20
  za_casp:        # South Africa: licensed crypto asset service providers (FSCA)
    enabled: true
    min_hours: 12
  br_bcb:         # Brazil: payment institutions, FX brokers, Pix participants and Pix applicants (Banco Central)
    enabled: true
    min_hours: 6

  us_states:      # US: money transmitter licensees, from the states that publish their own list
    enabled: true # FL, CA, MA, CT, LA, IN, DE, AK (others only publish via NMLS, which can't be used)
    skip: [ma]    # Massachusetts refuses downloads from GitHub's servers (HTTP 403); its firms still come via FinCEN.
                  # Alaska is tried once via its roster PDF; if that is refused too, it switches itself off.
    min_hours: 6  # states update monthly/quarterly; checked four times a day

# ---------------------------------------------------------------------------
# Direct national registers. Where one is set up and working, the sheet shows
# the national data for that country instead of the EU (EBA) copy, its
# changes are alerted, and the "Source check" tab measures how far behind the
# EU copy runs. Add a country here when its regulator offers a CSV or Excel
# download.
national:
  NL:
    # DNB refuses downloads from GitHub's servers (HTTP 403), so NL stays on the
    # EU copy. Could be revisited with a free DNB API key (api.portal.dnb.nl).
    enabled: false
    regulator: DNB
    files:
      - url: https://www.dnb.nl/en-GB/registerdownloadcomplete/TheNetherlands/csv
        register_url: https://www.dnb.nl/en/public-register/
        # licence type from the register/type column; first matching pattern wins
        type_patterns:
          "electronic money|elektronisch geld|e-money": E-money institution
          "account information|rekeninginformatie": Account information service provider
          "payment (service provider|institution)|betaalinstelling|betaaldienstverlener": Payment institution
  LT:
    enabled: true
    regulator: LB
    files:
      - url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=6&export=csv
        register_url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=6
        licence_type: Payment institution
        # keep firms licensed in Lithuania; drop EU firms passporting in, and branches
        exclude_column: Business form
        exclude_pattern: "Member State|branch|third countr"
        require_column: Company code     # Lithuanian firms always have one
        type_overrides:
          "^(Currency exchange operators, )?Account information service provider$": Account information service provider
      - url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=7&export=csv
        register_url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=7
        licence_type: E-money institution
        exclude_column: Business form
        exclude_pattern: "Member State|branch|third countr"
        require_column: Company code     # Lithuanian firms always have one
        type_overrides:
          "^(Currency exchange operators, )?Account information service provider$": Account information service provider
  SK:
    # The NBS feed turned out to be the open-banking (PSD2 access) list, not the
    # full licence register: it misses Slovak EMIs and several PIs the EU register
    # has. Slovakia stays on the EU copy.
    enabled: false
    regulator: NBS
    files:
      # official PSD2 register feed: refreshed daily by 05:00, regenerated hourly
      - url: https://subjekty.nbs.sk/api/psd2
        format: nbs_psd2
        register_url: https://subjekty.nbs.sk/
        # NBS licence codes kept (banks "B" come from the ECB list; agents and
        # passported-in firms are left out)
        licence_codes:
          PI: Payment institution
          EM: E-money institution
          AISP: Account information service provider

# Contact details (website / email / phone). Only fills blanks; a value the
# register itself gives is never overwritten. The "Contact found via" column
# says where each one came from.
contacts:
  enabled: true        # registers + Wikidata lookups in the 2-hourly run
  parallel_sites: 24   # firm websites read at once by the contacts job (each is a different site)
  recheck_days: 180

# Telegram notifications (needs the TELEGRAM_BOT_TOKEN secret; see README).
# By default: every new licence, registration or application, all countries.
telegram:
  countries: []    # e.g. [GB, IE, LT, ZA, US, CA] to limit to these; empty = all
  events: []       # e.g. [NEW_LICENCE, LICENCE_LOST, TYPE_CHANGED]; empty = new licences / registrations

# Licence tracker configuration
# ---------------------------------------------------------------------------

# Firms licensed in these countries are never included (ISO-2 codes): sanctioned,
# plus OpenPayd's prohibited jurisdictions list (Nov 2026).
# Default = countries under comprehensive UK/EU/US sanctions programmes.
# Syria: UK, EU and US sanctions were substantially eased in 2025-26 - keep or
# remove SY in line with your compliance team's policy.
excluded_countries: [AF, AL, AM, AZ, BB, BF, BI, BW, BY, CD, CF, CU, GH, GN, GW, HT, IQ, IR, JM, JO, JP, KG, KH, KP, KZ, LY, MA, ML, MM, MZ, NI, PA, PK, PS, RU, SD, SN, SO, SS, SY, TJ, TM, TN, TT, TZ, UA, UG, UZ, VE, VU, YE, ZW]

# If a register suddenly lists fewer than 70% of yesterday's active firms,
# treat it as a broken download: skip it for the day instead of reporting
# mass "removals".
drop_guard: 0.7

# How many of the most recent changes to show on the "Changes" tab.
sheet_change_rows: 5000

# Give each country its own tab in the Google Sheet (as well as the all-countries
# "Licences" tab).
sheet_country_tabs: true

sources:
  fca:            # UK: EMIs, small EMIs, APIs, SPIs, cryptoasset firms, e-money & payment agents (FCA API)
    enabled: true
    requests_per_second: 4.5      # FCA limit is 50 per 10 seconds
    parallel_requests: 8          # lookups in flight at once (still capped by the line above)
    enrich_address: true          # one extra call per firm, once: town, website, phone
    exclude_types: [RAISP]        # licence types not tracked (account-information-only firms)
    agents: [emd, psd]            # also track e-money agents (emd) and payment agents (psd)
    # One-off seed scan, in this order. Editing this list is safe: ranges
    # already scanned are kept, and the rest is re-planned in the new order.
    seed_ranges:
      - [900000, 999999]          # most EMIs (and cryptoasset firms registered since 2020)
      - [1000000, 1100000]        # 7-digit FRNs issued since 2023 (the newest firms)
      - [500000, 899999]          # most APIs / SPIs
    # 100000-499999 (pre-2009 firms, mostly banks/insurers) is not scanned; the
    # few cryptoasset firms there are tracked via data/fca_crypto_frns.txt.
    frontier_back: 3000           # daily: re-scan this many FRNs below the newest
    frontier_ahead: 2000          # ...and this many above it
    frontier_back_weekly: 25000   # weekly wider re-scan
    full_recheck_weekday: 6       # 0=Mon ... 6=Sun: also re-check inactive firms
    track_services: false
    # CFD vertical: the same scan also looks at each authorised firm's permissions and lists the
    # firms allowed to deal in / arrange CFDs, spread bets or rolling spot forex in the
    # "United Kingdom (CFD)" tab. FRNs the payment scan has already passed, plus the older range
    # below, are re-checked once for this by the UK scan workflow (it keeps running until done).
    cfd:
      enabled: true
      extra_ranges:
        - [100000, 499999]        # long-established brokers (IG, CMC, City Index ...)

  fca_cfd:        # UK CFD / FX providers found by the FCA scan above (shown in "United Kingdom (CFD)")
    enabled: true

  pra:            # UK: banks and building societies (PRA monthly lists)
    enabled: false   # banks no longer tracked
    # urls:                       # uncomment to pin the CSVs if the page changes
    #   banks: https://www.bankofengland.co.uk/-/media/...csv
    #   building_societies: https://www.bankofengland.co.uk/-/media/...csv

  eba:            # EU/EEA: PIs, EMIs, AISPs and small/exempt PIs & EMIs
    enabled: true
    entity_types: [PSD_PI, PSD_EMI, PSD_AISP, PSD_EPI, PSD_EEMI]
    exclude_jurisdictions: [GB]   # UK comes from the FCA instead
    track_services: true          # also flag changes to authorised services

  ecb:            # EU: credit institutions (banks), ECB daily MFI list
    enabled: false   # credit institutions no longer tracked
    exclude_jurisdictions: [GB]

  fintrac:        # Canada: money services businesses (FINTRAC publishes monthly)
    enabled: true

  boc:            # Canada: payment service providers under the RPAA (Bank of Canada)
    enabled: true
    details_per_run: 400          # detail pages (email, website) opened per run; cached after that
    details_first: applicant      # which list gets its emails/websites filled in first
    detail_delay_seconds: 1.0     # pause between detail pages, to be polite to the site

  finma:          # Switzerland: banks and FinTech licence holders
    enabled: true
    include_types: "article 1b|fintech"   # FinTech licence holders ("Persons under Article 1b of the Banking Act")
    exclude_types: "representati"         # not the representations of foreign FinTech firms

  fincen:         # US: FinCEN's own site. Off: its robots.txt blocks automated downloads; the same
    enabled: false # list comes in through fincen_os (OpenSanctions copy) below
    min_hours: 12 # FinCEN updates weekly; no need to download the 5 MB file every 2 hours

  fincen_os:      # US: FinCEN's MSB list via OpenSanctions' daily copy (FinCEN blocks automated downloads)
    enabled: true  # OpenSanctions data is free for NON-COMMERCIAL use only; use inside a for-profit
                   # business (e.g. prospecting for an employer) needs their data licence.
    min_hours: 20

  mica:           # EU/EEA: MiCA crypto-asset service providers and e-money token issuers (ESMA register)
    enabled: true
    min_hours: 6

  ch_sro:         # Switzerland: AML SRO membership, looked up firm by firm on FINMA's member search
    enabled: true
    min_hours: 20                 # once a day
    lookups_per_run: 40
    recheck_days: 60

  za_tppp:        # South Africa: third-party payment providers (SARB public register)
    enabled: true
    min_hours: 12
  za_so:          # South Africa: payment system operators (SARB)
    enabled: true
    min_hours: 12
  za_pchso:       # South Africa: payment clearing house system operators (SARB)
    enabled: true
    min_hours: 12
  za_banks:       # South Africa: banks, branches of foreign banks, mutual banks (Prudential Authority)
    enabled: true
    min_hours: 12
  za_banks_wiki:  # South Africa: banks from Wikipedia's list (unofficial backup; off now the official SARB lists load)
    enabled: false
    min_hours: 20
  za_adla:        # South Africa: authorised dealers in foreign exchange with limited authority (SARB ADLA manual)
    enabled: true
    min_hours: 20
  za_casp:        # South Africa: licensed crypto asset service providers (FSCA)
    enabled: true
    min_hours: 12
  nat_hk:         # Hong Kong registers (see national: below); lists change slowly
    min_hours: 6
  nat_ng:
    min_hours: 12
  br_bcb:         # Brazil: payment institutions, FX brokers, banks, Pix participants and Pix applicants (Banco Central)
    enabled: true
    include_banks: true
    min_hours: 6

  us_states:      # US: money transmitter licensees, from the states that publish their own list
    enabled: true # FL, CA, MA, CT, LA, IN, DE, AK (others only publish via NMLS, which can't be used)
    skip: [ma]    # Massachusetts refuses downloads from GitHub's servers (HTTP 403); its firms still come via FinCEN.
                  # Alaska is tried once via its roster PDF; if that is refused too, it switches itself off.
    min_hours: 6  # states update monthly/quarterly; checked four times a day

# ---------------------------------------------------------------------------
# How often each national register below is re-read (hours), unless set under sources:.
national_min_hours: 12

# Direct national registers. Where one is set up and working, the sheet shows
# the national data for that country instead of the EU (EBA) copy, its
# changes are alerted, and the "Source check" tab measures how far behind the
# EU copy runs. Add a country here when its regulator offers a CSV or Excel
# download.
national:
  NL:
    # DNB refuses downloads from GitHub's servers (HTTP 403), so NL stays on the
    # EU copy. Could be revisited with a free DNB API key (api.portal.dnb.nl).
    enabled: false
    regulator: DNB
    files:
      - url: https://www.dnb.nl/en-GB/registerdownloadcomplete/TheNetherlands/csv
        register_url: https://www.dnb.nl/en/public-register/
        # licence type from the register/type column; first matching pattern wins
        type_patterns:
          "electronic money|elektronisch geld|e-money": E-money institution
          "account information|rekeninginformatie": Account information service provider
          "payment (service provider|institution)|betaalinstelling|betaaldienstverlener": Payment institution
  LT:
    enabled: true
    regulator: LB
    files:
      - url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=6&export=csv
        register_url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=6
        licence_type: Payment institution
        # keep firms licensed in Lithuania; drop EU firms passporting in, and branches
        exclude_column: Business form
        exclude_pattern: "Member State|branch|third countr"
        require_column: Company code     # Lithuanian firms always have one
        type_overrides:
          "^(Currency exchange operators, )?Account information service provider$": Account information service provider
      - url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=7&export=csv
        register_url: https://www.lb.lt/en/sfi-financial-market-participants?market=1&type=7
        licence_type: E-money institution
        exclude_column: Business form
        exclude_pattern: "Member State|branch|third countr"
        require_column: Company code     # Lithuanian firms always have one
        type_overrides:
          "^(Currency exchange operators, )?Account information service provider$": Account information service provider
  SK:
    # The NBS feed turned out to be the open-banking (PSD2 access) list, not the
    # full licence register: it misses Slovak EMIs and several PIs the EU register
    # has. Slovakia stays on the EU copy.
    enabled: false
    regulator: NBS
    files:
      # official PSD2 register feed: refreshed daily by 05:00, regenerated hourly
      - url: https://subjekty.nbs.sk/api/psd2
        format: nbs_psd2
        register_url: https://subjekty.nbs.sk/
        # NBS licence codes kept (banks "B" come from the ECB list; agents and
        # passported-in firms are left out)
        licence_codes:
          PI: Payment institution
          EM: E-money institution
          AISP: Account information service provider

  # ----------------------------------------------------------------- Asia-Pacific / Africa
  # Each file is checked against the site's robots.txt. If one file can't be read, its
  # firms from the last good run are kept, so an outage isn't reported as removals.
  HK:
    regulator: HKMA
    files:
    - label: HKMA SVF licensees
      url: https://api.hkma.gov.hk/public/bank-svf-info/register-svf-licensees?lang=en&segment=SVFLic&offset=0
      register_url: https://www.hkma.gov.hk/eng/regulatory-resources/registers/register-of-svf-licensees
      licence_type: Stored value facility licensee (e-money)
      id_column: licence_no
    - label: HKMA banks
      url: https://api.hkma.gov.hk/public/bank-svf-info/register-ais-lros?lang=en&pagesize=1000&offset=0
      register_url: https://www.hkma.gov.hk/eng/key-functions/banking/banking-regulatory-and-supervisory-regime/register-of-authorized-institutions-and-local-representative-offices/
      type_column: type
      type_patterns:
        restricted licen: Bank (restricted licence bank)
        ^licensed bank: Bank (licensed bank)
    - label: Customs money service operators
      regulator: C&ED
      url: https://eservices.customs.gov.hk/MSOS/wsrh/003s1?request_locale=en&format=csv
      register_url: https://eservices.customs.gov.hk/MSOS/wsrh/001s0
      licence_type: Money service operator (remittance / money changer)
      name_column: Name of Licensee (English)
    - label: SFC licensed crypto platforms
      regulator: SFC
      url: https://www.sfc.hk/en/Welcome-to-the-Fintech-Contact-Point/Virtual-assets/Virtual-asset-trading-platforms-operators/Lists-of-virtual-asset-trading-platforms
      format: html_table
      table_headers: CE Reference
      name_column: Company name of virtual asset trading platform operator
      licence_type: Crypto trading platform (SFC licensed)
    - label: SFC crypto platform applicants
      regulator: SFC
      url: https://www.sfc.hk/en/Welcome-to-the-Fintech-Contact-Point/Virtual-assets/Virtual-asset-trading-platforms-operators/Lists-of-virtual-asset-trading-platforms
      format: html_table
      table_headers: Date of submission of licence application
      table_exclude: removal|CE Reference|closed down
      name_column: Company name of virtual asset trading platform operator
      licence_type: Crypto trading platform applicant (SFC)
  NG:
    regulator: CBN
    files:
    - label: CBN money transfer operators
      url: https://www.cbn.gov.ng/PaymentsSystem/InternationalMoneyTransferOperators.html
      format: html_table
      columns:
      - 'No'
      - Name
      - Address
      licence_type: International money transfer operator (IMTO)
    - label: CBN licensed payment service providers
      url: https://www.cbn.gov.ng/PaymentsSystem/PSPs.html
      format: html_table
      all_tables: true
      columns:
      - 'No'
      - Name
      type_column: section
      type_patterns:
        mobile money: Mobile money operator (CBN)
        switching: Switching and processing (CBN)
        payment solution service provider|PSSP: Payment solution service provider (CBN)
        terminal services provider|PTSP: Payment terminal service provider (CBN)
        super.?agent: Super-agent (CBN)
        holding: Payments service holding company (CBN)
        aggregator: Payment terminal service aggregator (CBN)
        card|scheme: Card / payment scheme (CBN)
        payment solution: Payment solution services (CBN)
    - label: CBN deposit money banks
      format: pdf_table
      licence_type: 'Bank (CBN licensed: commercial, merchant or non-interest)'
      url: https://www.cbn.gov.ng/Out/2024/CCD/LIST OF DEPOSIT MONEY BANKS AS AT 26TH APRIL, 2024 (1).pdf
      name_column: NAME OF INSTITUTION
      address_column: HEAD OFFICE ADDRESS
      name_exclude: holdings|\bgroup\b|financial holding
    - label: SEC digital asset operators (ARIP)
      regulator: SEC
      url: https://sec.gov.ng/fintech-and-innovation-hub-finport/registered-fintech-operators/
      format: html_table
      table_headers: Function
      name_column: Company
      licence_type: Digital asset service provider (SEC ARIP)
    - label: SEC regulatory incubation participants
      regulator: SEC
      url: https://sec.gov.ng/fintech-and-innovation-hub-finport/registered-fintech-operators/
      format: html_table
      table_headers: Proposed Solution
      name_column: Company
      type_column: Institution Type
      type_patterns:
        VASP|digital asset: Digital asset service provider (SEC incubation)
        .: Fintech in SEC regulatory incubation
  SG:
    regulator: MAS
    files:
    - label: MAS directory export
      url: https://eservices.mas.gov.sg/fid/custom/printpartial?count=0
      format: html_table
      type_patterns: &id001
        major payment: Major payment institution (MAS)
        standard payment: Standard payment institution (MAS)
        money.chang: Money-changing licensee (MAS)
        remittance: Remittance licensee (MAS)
        merchant bank: Merchant bank (MAS)
        bank: Bank (MAS)
    - label: MAS directory cards
      url: https://eservices.mas.gov.sg/fid/institution?count=0
      format: text_regex
      raw_html: true
      row_regex: header-inner-2">(?P<name>[^<]+)</h3>.*?FilterCategory"[^>]*>(?P<type>[^<]+)</a>
      type_patterns: *id001
    - label: Print/Download List
      url: https://eservices.mas.gov.sg/fid/institution/print?count=0
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
  AE:
    regulator: VARA
    files:
    - label: VARA register page
      url: https://www.vara.ae/en/licenses-and-register/public-register/
      format: html_table
      table_headers: VASP Name
      name_column: VASP Name
      id_column: Reference
      licence_type: Virtual asset service provider (VARA, Dubai)
    - label: CBUAE register
      regulator: CBUAE
      page: https://www.centralbank.ae/en/licensing/
      link_pattern: cb-register
      format: pdf_table
    - label: DFSA firms
      regulator: DFSA
      url: https://www.dfsa.ae/public-register/firms
      probe: true
      follow: public-register|firm
      follow_max: 6
  MY:
    regulator: BNM
    files:
    - label: BNM non-bank e-money issuers
      url: https://www.bnm.gov.my/non-bank-e-money-issuers
      format: html_table
      name_column: Company Name
      type_column: Category of License
      type_patterns:
        e-money: E-money issuer (non-bank)
        merchant acquirer: Merchant acquirer (non-bank)
        remittance: Remittance licensee
    - label: BNM MSB licensees
      url: https://www.bnm.gov.my/regulations/fsp-directory/msb-licensees
      format: html_table
      name_column: Licensee
      id_column: Business Registration Number
      type_column: Type of money services
      address_column: Full Address
      type_patterns:
        remittance.*currency|currency.*remittance: Money services business – remittance & currency exchange
        remittance: Money services business – remittance
        currency: Money services business – currency exchange
    - label: BNM FSP directory (banks)
      url: https://www.bnm.gov.my/regulations/fsp-directory
      format: html_table
      name_column: Company Name
      type_column: Category of License
      type_patterns:
        islamic bank: Bank (Islamic bank)
        digital bank: Bank (digital bank)
        investment bank: Bank (investment bank)
        commercial bank|licensed bank: Bank (commercial bank)
    - label: BNM payment system regulatees
      url: https://www.bnm.gov.my/list-of-regulatees
      probe: true
    - label: BNM digital MSB channels
      url: https://www.bnm.gov.my/documents/20124/1326831/Microsite_Digital.pdf/
      format: pdf_table
      licence_type: Money services business (digital remittance)
      squeeze: true
    - label: BNM B2B remittance
      url: https://www.bnm.gov.my/documents/20124/1326831/Microsite-B2B.pdf
      format: pdf_table
      licence_type: Money services business (B2B remittance)
    - label: SC registered digital asset exchanges
      regulator: SC
      url: https://www.sc.com.my/development/digital/list-of-registered-digital-asset-exchanges
      probe: true
    - label: Principal Money Services Business Licensees
      url: https://www.bnm.gov.my/principal-msb-licensees
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: Approved Money Services Business Agents
      url: https://www.bnm.gov.my/regulations/fsp-directory/approved-msb-agents
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: Approved Payment System Operators
      url: https://www.bnm.gov.my/regulations/fsp-directory?p_p_id=com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_jXC730NRlqU0&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&p_r_p_tag=approved-payment-system-operator
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: BNM principal MSB licensees
      url: https://www.bnm.gov.my/principal-msb-licensees
      format: html_table
      name_column: Company Name
      licence_type: Money services business (principal licensee)
    - label: BNM approved payment system operators
      url: https://www.bnm.gov.my/regulations/fsp-directory?p_p_id=com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_approved_payment_system_operators
      format: html_table
      name_column: Company Name
      licence_type: Payment system operator (BNM approved)
  AU:
    regulator: APRA
    files:
      - label: APRA ADIs and payment facilities
        url: https://www.apra.gov.au/register-of-authorised-deposit-taking-institutions
        format: html_table
        all_tables: true
        table_headers: "entity name"
        type_column: section
        type_patterns:
          "purchased payment": Purchased payment facility provider (e-money)
          "branch": Bank (branch of foreign bank)
          "foreign subsidiar": Bank (foreign subsidiary bank)
          "restricted": Bank (restricted ADI)
          "australian": Bank / ADI (Australian-owned)
      - label: AUSTRAC digital currency exchange register
        regulator: AUSTRAC
        url: https://www.austrac.gov.au/digital-currency-exchange-register
        probe: true

  MX:
    regulator: CNBV
    files:
    - label: CNBV supervised entities register
      url: https://www.cnbv.gob.mx/Paginas/InfoPES.aspx
      probe: true
      follow: padr|xls|csv|entidades|ifpe|fondos de pago
      follow_max: 12
    - label: CNBV register of supervised entities
      url: https://www.cnbv.gob.mx/Paginas/PADRÓN-DE-ENTIDADES-SUPERVISADAS.aspx
      probe: true
    - label: www.cnbv.gob.mx homepage
      url: https://www.cnbv.gob.mx/
      probe: true
      follow: licen|regist|list|supervis|institution|entit|payment|e-money|money|remit|crypto|virtual|bank|banc|banque|pago|paiement|pagamento|autoriz|agr|exchange|bureau|operator
      follow_max: 15
  IN:
    regulator: RBI
    files:
    - label: RBI authorised payment system operators
      url: https://www.rbi.org.in/Scripts/PublicationsView.aspx?Id=12043
      format: html_table
      table_headers: Name of the Authorised
      name_column: Name of the Authorised
      type_column: Payment System Authorised
      type_patterns:
        prepaid|PPI: Prepaid payment instrument issuer (RBI)
        aggregator: Payment aggregator (RBI)
        cross.?border|money transfer|MTSS: Cross-border payments / money transfer (RBI)
        card network|card payment: Card network (RBI)
        ATM: White-label ATM operator (RBI)
        BBPOU|bill: Bharat Bill Payment operator (RBI)
        TReDS|trade receivable: Trade receivables platform (RBI)
        .: Payment system operator (RBI)
    - label: RBI banks permitted to issue prepaid instruments
      url: https://rbi.org.in/Scripts/bs_viewcontent.aspx?Id=2491
      format: html_table
      name_column: Name of the Banks
      licence_type: Bank (RBI, issues prepaid instruments)
    - label: RBI banks in India
      url: https://www.rbi.org.in/scripts/FinancialAgents.aspx
      probe: true
      follow: banks in india|payment banks|small finance|scheduled
      follow_max: 6
    - label: List of Agency Banks
      url: https://www.rbi.org.in/commonman/English/Scripts/Content.aspx?id=2139
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: List of Approved/Authorised Entities - Payment Sys
      url: https://rbi.org.in/Scripts/PublicationsView.aspx?id=12043
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: 'List of Banks Permitted to Provide Mobile Banking '
      url: https://rbi.org.in/Scripts/bs_viewcontent.aspx?Id=2463
      probe: true
      follow: \.pdf|\.xlsx?|\.csv|list|register|licen|bank|payment|money|remit|exchange|virtual|crypto
      follow_max: 6
    - label: RBI scheduled commercial banks
      url: https://www.rbi.org.in/scripts/bs_viewcontent.aspx?Id=3657
      format: html_table
      all_tables: true
      columns:

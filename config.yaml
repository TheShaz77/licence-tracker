# -------------------------------------------------------------------------- iGaming vertical ---
# Crypto casinos, PSPs, platform / game providers and affiliates (OpenPayd crypto on/off-ramp and
# named vIBAN leads). Same reader options as cfd: above; firms go to "Country (iGaming)" tabs and
# "iGaming (all countries)", with a business-type column that is a guess from name + licence.
# Probes only save the page (data/debug/raw) so a reader can be written once its layout is known.
igaming:
  GB:
    regulator: Gambling Commission
    files:
    - label: UKGC register - remote and B2B gambling licences
      url: https://www.gamblingcommission.gov.uk/downloads/business-licence-register-licences.csv
      join: {url: 'https://www.gamblingcommission.gov.uk/downloads/business-licence-register-businesses.csv', 'on': Account Number}
      name_column: Account Name
      id_column: Account Number
      type_from_row: true
      type_patterns:
        'gambling software': Gambling software - B2B supplier (UKGC)
        'remote[^,]*gaming machine technical|host': Remote gaming machine technical / host - B2B (UKGC)
        'remote[^,]*casino': Remote casino (UKGC)
        'remote[^,]*bet': Remote betting (UKGC)
        'remote[^,]*bingo': Remote bingo (UKGC)
        'remote[^,]*lotter': Remote lottery (UKGC)
      register_url: https://www.gamblingcommission.gov.uk/public-register/businesses
  IM:
    regulator: GSC
    files:
    - label: Isle of Man online gambling (OGRA) licence holders
      page:
      - https://isleofmangsc.com/gambling/supervision/online-gambling-licensee-register/
      - https://www.isleofmangsc.com/gambling/supervision/online-gambling-licensee-register/
      link_pattern: ogra-licence-holders\.xlsx
      name_column: Company Name
      type_column: OGRA Licence type
      status_column: Licence Status
      date_column: Licence valid From
      website_column: Website Domain
      type_patterns:
        full: Online gambling licence - full (GSC)
        network: Network services licence (GSC)
        software: Software supply licence - B2B (GSC)
      register_url: https://www.isleofmangsc.com/gambling/supervision/online-gambling-licensee-register/
  CA:
    regulator: Kahnawake Gaming Commission
    files:
    - label: Kahnawake client provider authorizations (operators and their sites)
      url: https://gamingcommission.ca/interactive-gaming/permit-holders/
      format: html_table
      table_headers: operator
      name_column: OPERATOR
      website_column: URL
      licence_type: Client Provider Authorization (Kahnawake)
    - label: Kahnawake casino software provider authorizations
      url: https://gamingcommission.ca/interactive-gaming/permit-holders/
      format: html_table
      table_headers: software provider
      name_column: CASINO SOFTWARE
      licence_type: Casino Software Provider Authorization - B2B (Kahnawake)
    - label: Ontario registered internet gaming operators (probe)
      url: https://www.agco.ca/en/lottery-and-gaming/list-registered-internet-gaming-operators
      probe: true
      follow: igamingontario|operator|directory|regulated
  GG:
    regulator: AGCC (Alderney)
    files:
    - label: Alderney eGambling licensees
      url: https://www.gamblingcontrol.org/applications-guidance/egambling-licensees
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?:\S+\.[a-z]{2,6}\S*\s+)*(?P<name>[^\n()]{2,120}?(?:\([^)\n]*\)[^\n()]*?)?(?:Limited|Ltd\.?|LLC|plc|Inc\.?|B\.V\.|N\.V\.|S\.A\.|AG|GmbH|SRL|S\.L\.))\s*\((?P<type>1\s*&\s*2|1|2)\)'
      type_patterns:
        '1\s*&\s*2': eGambling licence - category 1 & 2, B2C + B2B (AGCC)
        '^1$': eGambling licence - category 1, B2C (AGCC)
        '^2$': eGambling licence - category 2, B2B (AGCC)
    - label: Alderney temporary eGambling licensees
      url: https://www.gamblingcontrol.org/temporary-egambling-licensees
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?:\S+\.[a-z]{2,6}\S*\s+)*(?P<name>[^\n()]{2,120}?(?:\([^)\n]*\)[^\n()]*?)?(?:Limited|Ltd\.?|LLC|plc|Inc\.?|B\.V\.|N\.V\.|S\.A\.|AG|GmbH|SRL|S\.L\.))\s*$'
      licence_type: Temporary eGambling licence (AGCC)
    - label: Alderney core service provider associates
      url: https://www.gamblingcontrol.org/core-service-provider-associates
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?:\S+\.[a-z]{2,6}\S*\s+)*(?P<name>[^\n()]{2,120}?(?:\([^)\n]*\)[^\n()]*?)?(?:Limited|Ltd\.?|LLC|plc|Inc\.?|B\.V\.|N\.V\.|S\.A\.|AG|GmbH|SRL|S\.L\.))\s*$'
      licence_type: Core service provider associate - B2B (AGCC)
    - label: Alderney category 1 and 2 associate certificates
      url: https://www.gamblingcontrol.org/category-1-and-2-associate-certificates
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?:\S+\.[a-z]{2,6}\S*\s+)*(?P<name>[^\n()]{2,120}?(?:\([^)\n]*\)[^\n()]*?)?(?:Limited|Ltd\.?|LLC|plc|Inc\.?|B\.V\.|N\.V\.|S\.A\.|AG|GmbH|SRL|S\.L\.))\s*$'
      licence_type: Category 1/2 associate certificate - B2B (AGCC)
  IE:
    regulator: GRAI
    files:
    - label: Gambling Regulatory Authority of Ireland register
      page: https://www.grai.ie/register
      link_pattern: \.csv
      keep_all: true
      register_url: https://www.grai.ie/register

  GI:
    regulator: Gibraltar Gambling Division
    files:
    - label: Gibraltar licence holders (B2C, B2B, support services)
      url: https://gamblingdivision.gov.gi/licence-holders
      format: html_table
      all_tables: true
      name_column: Company
      type_from_row: true
      exclude_column: section
      exclude_pattern: non-remote|land-based
      type_patterns:
        'affiliate|marketing': Marketing / affiliate services licence (Gibraltar)
        'support service': Gambling operator support services licence (Gibraltar)
        'B2B|business-to-business': B2B remote gambling licence (Gibraltar)
        '.': B2C remote gambling licence (Gibraltar)
      register_url: https://gamblingdivision.gov.gi/licence-holders
  BR:
    regulator: SPA (Ministry of Finance)
    files:
    - label: Brazil - companies authorised for fixed-odds betting and online games (SPA)
      page:
      - https://www.gov.br/fazenda/pt-br/composicao/orgaos/secretaria-de-premios-e-apostas/lista-de-empresas
      - https://www.gov.br/fazenda/pt-br/composicao/orgaos/secretaria-de-premios-e-apostas/lista-de-empresas/confira-a-lista-de-empresas-autorizadas-a-ofertar-apostas-de-quota-fixa-em-2025
      link_pattern: (lista|planilha)[^/]*autoriza[^/]*\.pdf
      fallback_urls:
      - https://www.gov.br/fazenda/pt-br/composicao/orgaos/secretaria-de-premios-e-apostas/lista-de-empresas/ListadeAutorizaes12.08.25.5.pdf
      format: pdf_table
      name_column: DENOMINA
      id_column: CNPJ
      website_column: DOM
      licence_type: Fixed-odds betting / online games authorisation (SPA, Brazil)
      register_url: https://www.gov.br/pt-br/servicos/consultar-as-empresas-autorizadas-a-operar-apostas-de-quota-fixa
  ES:
    regulator: DGOJ
    files:
    - label: Spain - DGOJ licensed gambling operators
      url: https://www.ordenacionjuego.es/en/operadores-juego/operadores-licencia/operadores?title=&licences=All&order=title&sort=asc&page={page}
      fallback_urls:
      - https://ordenacionjuego.es/en/operadores-juego/operadores-licencia/operadores?title=&licences=All&order=title&sort=asc&page={page}
      paginate: {start: 0, step: 1, max: 30, marker: 'operadores-licencia/operadores/([a-z0-9-]+)'}
      format: html_table
      name_column: Operador
      website_column: Lista de dominios
      licence_type: Online gambling licence (DGOJ, Spain)
      register_url: https://www.ordenacionjuego.es/en/operadores-juego/operadores-licencia/operadores
  FR:
    regulator: ANJ
    files:
    - label: France - ANJ licensed online operators
      url: https://anj.fr/offre-de-jeu-et-marche/operateurs-agrees
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?P<name>[^\n:]{2,100})\n+\s*Noms? d(?:u|es) sites?\s*:?\s*\n?\s*(?P<website>[^\n]+)\n+\s*Cat[ée]gories?\s*:?\s*\n?\s*(?P<type>[^\n]+)'
      licence_type: Online betting / poker licence (ANJ, France)
      register_url: https://anj.fr/offre-de-jeu-et-marche/operateurs-agrees
  DE:
    regulator: GGL
    files:
    - label: Germany - GGL whitelist (online sports betting, slots, poker, casino)
      url: https://www.gluecksspiel-behoerde.de/de/fuer-spielende/uebersicht-erlaubter-anbieter-whitelist
      format: text_regex
      multiline: true
      row_regex: '(?m)^(?P<name>[^\n]{3,120}?)\n+\s*(?P<type>Sportwetten|Virtuelle Automatenspiele|Online-Poker|Online-Casinospiele|Online-Casino[^\n]*|Gewerbliche Spielvermittlung)\s*$'
      type_patterns:
        'Sportwetten': Online sports betting permit (GGL, Germany)
        'Automatenspiele': Virtual slot games permit (GGL, Germany)
        'Poker': Online poker permit (GGL, Germany)
        'Casino': Online casino permit (GGL, Germany)
        'Spielvermittlung': Commercial gambling broker permit (GGL, Germany)
      register_url: https://www.gluecksspiel-behoerde.de/de/fuer-spielende/uebersicht-erlaubter-anbieter-whitelist

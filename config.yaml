  AW:
    regulator: CBA
    files:
    # CBA: one page, institutions listed under headings; firms are read with their legal form and
    # the heading they sit under (insurance, pensions, trusts and brokers are left out).
    - label: CBA institutions under supervision
      url: https://cbaruba.org/financial-institutions-under-supervision-of-the-central-bank
      format: text_regex
      ignore_case: false
      row_regex: '^(?P<name>[A-Z0-9][^\n]{2,90}?\b(?:N\.V\.?|VBA|V\.B\.A\.?|B\.V\.?|Inc\.?|Ltd\.?|Limited))\s*$'
      section_regex: '^(?:\d+\.\s*)?(Commercial banks|Mortgage banks|Credit unions|Other financial institutions|Pawnshops|Finance companies|Mortgage brokers|.*[Ii]nsurance.*|.*[Pp]ension.*|.*Money Transaction Compan.*|Trust Service Providers|.*[Bb]rokers.*|.*[Ss]ecurities.*|Credit Institutions that have registered.*)\s*$'
      exclude_column: section
      exclude_pattern: '[Ii]nsurance|[Pp]ension|Trust|[Bb]roker|[Ss]ecurities|Pawn|registered'
      type_column: section
      type_patterns:
        'Commercial banks': Commercial bank (CBA)
        'Mortgage banks': Mortgage bank (CBA)
        'Credit unions': Credit union (CBA)
        'Other financial': Other financial institution (CBA)
        'Finance compan': Finance company (CBA)
        'Money Transaction': Money transaction company (CBA)
      register_url: https://cbaruba.org/financial-institutions-under-supervision-of-the-central-bank


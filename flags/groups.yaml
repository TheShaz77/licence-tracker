# Researched company groups for the "Do not contact / competitor" flag.
#
# dnc_groups: brands on the do-not-contact list (do_not_contact.txt) whose other entities trade under
#   different legal names. "match" are regular expressions tried against firm names (lower case);
#   "owners" are parent companies / shareholders that own a listed company (they are flagged too);
#   "note" is shown in the sheet's "Flag reason" column.
# competitors: OpenPayd competitors (banking-as-a-service, embedded accounts / vIBANs, FX and
#   cross-border payment infrastructure, fiat rails for crypto firms).
#
# On top of this file, each run looks up every listed company in GLEIF (the global LEI register's
# parent / subsidiary data) and Wikidata (parent organisation / subsidiary / owned by), and flags the
# related entities it finds (data/state/flag_entities.json).

dnc_groups:
